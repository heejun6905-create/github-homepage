<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub 기반 홈페이지</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="hero">
      <div class="container hero-inner">
        <img id="avatar" class="avatar" alt="GitHub 프로필 이미지" />
        <div>
          <p class="eyebrow">GitHub Data Powered</p>
          <h1 id="name">로딩 중...</h1>
          <p id="bio" class="bio">GitHub 프로필 정보를 불러오는 중입니다.</p>
          <a id="profileLink" class="btn" target="_blank" rel="noreferrer">GitHub 프로필 보기</a>
        </div>
      </div>
    </header>

    <main class="container">
      <section class="stats">
        <article class="stat-card">
          <h2>Followers</h2>
          <p id="followers">-</p>
        </article>
        <article class="stat-card">
          <h2>Following</h2>
          <p id="following">-</p>
        </article>
        <article class="stat-card">
          <h2>Public Repos</h2>
          <p id="publicRepos">-</p>
        </article>
        <article class="stat-card">
          <h2>GitHub 가입일</h2>
          <p id="joinedAt">-</p>
        </article>
      </section>

      <section class="repos-section">
        <div class="section-header">
          <h2>최근 저장소</h2>
          <p>GitHub 공개 저장소 기준으로 자동 표시됩니다.</p>
        </div>
        <div id="repos" class="repos-grid">
          <p class="muted">저장소를 불러오는 중...</p>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="container">
        <p>© <span id="year"></span> <span id="footerName">GitHub User</span></p>
      </div>
    </footer>

    <script src="./script.js"></script>
  </body>
</html>
